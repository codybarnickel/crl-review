<title>Coquille River Lighthouse Panels</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Libre+Franklin:wght@400;500;600;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one panel per screen. The sign copy leads on a cream "panel" surface, questions sit in their own blue band with an answer box each, and reference material sits last in small muted type. A numbered strip and big Previous/Next buttons move between panels. */
:root{
  --bg:#f3efe4;
  --surface:#fffdf7;
  --sign:#fff7e1;
  --ink:#201c14;
  --muted:#62594d;
  --line:#d6ccb9;
  --deep:#1f4154;
  --on-deep:#fff7e1;
  --ask:#e4eef1;
  --ask-line:#9fbcc6;
  --accent:#9b5b2c;
  --gold:#e5ab55;
  --tribal-bg:#f4e3cf;
  --tribal-fg:#754829;
  --s-none:#8a8178;
  --s-dev:#a8661a;
  --s-draft:#2f6f8a;
  --s-proof:#4e713f;
  --f-display:"League Gothic","Oswald","Arial Narrow",sans-serif;
  --f-ui:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --f-copy:"Old Standard TT","Century Schoolbook","Georgia",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181b;--surface:#1a2226;--sign:#242c2f;--ink:#efe8d8;--muted:#b3aa9b;--line:#34414a;
  --deep:#8fc1d4;--on-deep:#12181b;--ask:#1c3038;--ask-line:#3d6372;--accent:#e2a06b;--gold:#e5ab55;
  --tribal-bg:#3a2c1f;--tribal-fg:#f0c79a;--s-none:#9a928a;--s-dev:#e3a24a;--s-draft:#7ec0db;--s-proof:#9cc58a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181b;--surface:#1a2226;--sign:#242c2f;--ink:#efe8d8;--muted:#b3aa9b;--line:#34414a;
  --deep:#8fc1d4;--on-deep:#12181b;--ask:#1c3038;--ask-line:#3d6372;--accent:#e2a06b;--gold:#e5ab55;
  --tribal-bg:#3a2c1f;--tribal-fg:#f0c79a;--s-none:#9a928a;--s-dev:#e3a24a;--s-draft:#7ec0db;--s-proof:#9cc58a;color-scheme:dark}

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:19px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--deep)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--deep);color:var(--on-deep)}
.top .wrap{padding-block:10px 12px;display:grid;gap:10px}
.top .r1{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.top .brand{font-family:var(--f-display);font-size:28px;line-height:1;letter-spacing:.02em;margin-right:auto;text-decoration:none;color:var(--on-deep)}
.top label{font-size:15px;font-weight:600}
.top input{font:inherit;font-size:17px;padding:7px 10px;border-radius:6px;border:0;background:var(--surface);color:var(--ink);width:min(220px,60vw)}
.strip{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.strip a{display:grid;place-items:center;min-width:44px;height:44px;padding:0 4px;border-radius:6px;font-weight:700;font-size:18px;text-decoration:none;color:var(--on-deep);border:2px solid transparent;position:relative;font-variant-numeric:tabular-nums}
.strip a:hover{border-color:var(--on-deep)}
.strip a[aria-current="page"]{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.strip a.has::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.strip .brk{flex-basis:100%;height:0}
.strip .lbl{align-self:center;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-right:4px}
.strip .wide{font-size:16px;padding:0 12px}

main .wrap{padding-block:28px 72px}
.view{display:grid;gap:28px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:18px;font-weight:700;padding:14px 22px;border-radius:8px;border:2px solid var(--deep);background:var(--deep);color:var(--on-deep);cursor:pointer;text-decoration:none;min-height:52px}
.btn.ghost{background:transparent;color:var(--deep)}
.btn:hover{filter:brightness(1.07)}

/* Start view */
.intro h1{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,8vw,72px);line-height:1;letter-spacing:.01em}
.intro p{max-width:60ch}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--deep);color:var(--on-deep);font-weight:700;font-size:20px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list a{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;color:var(--ink)}
.list a:hover{border-color:var(--deep)}
.list .n{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--accent);text-align:center}
.list .t{font-weight:700;font-size:20px;line-height:1.25;display:grid;gap:2px;min-width:0}
.list small{font-weight:500;font-size:15px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap}
.status::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.s-none{color:var(--s-none)}.s-dev{color:var(--s-dev)}.s-draft{color:var(--s-draft)}.s-proof{color:var(--s-proof)}
.tr{display:inline-block;font-family:var(--f-ui);font-size:13px;font-weight:700;font-style:normal;letter-spacing:.04em;padding:1px 9px;border-radius:99px;background:var(--tribal-bg);color:var(--tribal-fg);vertical-align:3px;white-space:nowrap}

/* Panel header */
.phead{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:end}
.phead .num{font-family:var(--f-display);font-size:120px;line-height:.8;color:var(--accent)}
.phead .of{font-size:15px;color:var(--muted);font-weight:600;display:flex;flex-wrap:wrap;gap:4px 14px}
.phead .of .status{font-size:15px}
.phead h2{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,6vw,52px);line-height:1;letter-spacing:.01em;text-transform:uppercase}
.phead .sub{font-size:19px;color:var(--muted);font-weight:500;margin-top:4px}
.sign .st{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,7vw,60px);line-height:1;letter-spacing:.01em;text-transform:uppercase;color:var(--ink)}
.sign .ss{font-family:var(--f-copy);font-size:26px;line-height:1.2;color:var(--ink)}
.sign .ss.tbd{font-family:var(--f-ui);font-size:17px;font-style:italic;color:var(--muted)}
.phead .status{font-size:16px}
.theme{font-size:17px;color:var(--muted);font-style:italic;max-width:62ch}
.theme span{font-style:normal;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-right:6px}

/* Sign copy */
.sign{background:var(--sign);border:1px solid var(--line);border-radius:10px;padding:26px 28px;display:grid;gap:26px;box-shadow:0 1px 0 var(--line)}
.sblock{display:grid;gap:12px}
.shead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;font-variant-numeric:tabular-nums}
.sblock p{font-family:var(--f-copy);font-size:21px;line-height:1.55;max-width:60ch}
.sblock p.note{font-family:var(--f-ui);font-size:18px}
.sblock blockquote{margin:0;font-family:var(--f-copy);font-style:italic;font-size:20px;line-height:1.5}
.sblock cite{display:block;font-style:normal;font-family:var(--f-ui);font-size:15px;color:var(--muted);margin-top:8px}
.tl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:10px 18px}
.tl dt{font-family:var(--f-display);font-size:26px;line-height:1.15;color:var(--accent);font-variant-numeric:tabular-nums}
.tl dd{margin:0;font-family:var(--f-copy);font-size:19px;line-height:1.45}
.concept{background:var(--sign);border:1px dashed var(--line);border-radius:10px;padding:20px 24px;display:grid;gap:6px}
.concept span{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Questions */
.asks{background:var(--ask);border:2px solid var(--ask-line);border-radius:10px;padding:22px 24px;display:grid;gap:16px}
.asks h3{font-size:24px;font-weight:700}
.ask{display:grid;gap:8px}
.ask label{display:grid;grid-template-columns:40px 1fr;gap:10px;font-weight:600;font-size:18px;line-height:1.4}
.qn{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--deep);color:var(--on-deep);font-size:15px;font-weight:700}
.qt{min-width:0}
textarea{font:inherit;font-size:18px;line-height:1.5;padding:12px 14px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical;width:100%;box-sizing:border-box}
textarea:focus{border-color:var(--deep);outline:none}
.ask textarea{margin-left:50px;width:calc(100% - 50px)}
.mynote{display:grid;gap:8px}
.mynote label{font-weight:700;font-size:20px}

.revs{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:22px 24px;display:grid;gap:10px}
.revs h3{font-size:24px;font-weight:700}
.revs .hint,.asks .hint{font-size:16px;color:var(--muted)}
.qgroup{display:grid;gap:14px}
.qgroup + .qgroup{border-top:1px solid var(--ask-line);padding-top:16px}
.qgroup h3{font-size:20px}
.qgroup h3 a{color:var(--ink)}
.todo{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
.todo h3{font-size:21px}
.todo ul{margin:0;padding-left:1.2em;display:grid;gap:8px}
.big table{font-size:17px}
td.pn{font-family:var(--f-display);font-size:26px;line-height:1.1;color:var(--accent);white-space:nowrap}
.field{display:grid;gap:8px}
.subrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ask .subrow,.ask .record,.ask .reclabel{margin-left:50px}
.btn.submit{padding:10px 22px;min-height:46px;font-size:17px}
.btn.submit[disabled]{opacity:.55;cursor:default}
.smsg{font-size:16px;font-weight:600}
.smsg.ok{color:var(--s-proof)}
.smsg.err{color:var(--accent)}
.record{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.record:empty{display:none}
.record li{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--s-proof);border-radius:6px;padding:10px 14px;display:grid;gap:2px}
.record .who{font-size:14px;font-weight:700;color:var(--muted)}
.record .txt{white-space:pre-wrap;font-size:17px}
.reclabel{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.namewarn{background:var(--tribal-bg);color:var(--tribal-fg);font-weight:700;padding:2px 8px;border-radius:4px}
@media (max-width:560px){.ask .subrow,.ask .record,.ask .reclabel{margin-left:0}}
/* Background */
.more{border-top:3px double var(--line);padding-top:18px;display:grid;gap:16px;color:var(--muted);font-size:16px;line-height:1.55}
.more h3{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.bg{display:grid;gap:6px}
.bg h4{font-size:16px;font-weight:700;color:var(--ink)}
.bg ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.raw{display:grid;gap:8px;font-family:var(--f-copy);font-size:16px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
tr:last-child td{border-bottom:0}

.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px}

/* Send */
.addr{font-weight:700;font-size:22px;user-select:all;color:var(--ink)}
#compiled{min-height:240px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.msg{font-weight:700;color:var(--s-proof);min-height:1.3em}
.confirm{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:8px}
.saved{font-size:15px;color:var(--muted);min-height:1.2em}
footer .wrap{padding-block:0 40px;color:var(--muted);font-size:15px}

@media (max-width:560px){
  .phead{grid-template-columns:1fr}
  .phead .num{font-size:72px}
  .sign{padding:20px 18px}
  .sblock p{font-size:19px}
  .ask textarea{margin-left:0;width:100%}
  .tl{grid-template-columns:1fr;gap:2px}
  .tl dd{margin-bottom:10px}
  .top .brand{font-size:24px}
}

.gate{min-height:100vh;display:grid;place-items:center;padding-block:40px}
.gate .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px 28px;display:grid;gap:14px;width:min(440px,100%);box-sizing:border-box}
.gate h1{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1;letter-spacing:.01em}
.gate p{color:var(--muted);font-size:17px}
.gate label{font-weight:700;font-size:17px}
.gate input{font:inherit;font-size:19px;padding:12px 14px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.gate input:focus{border-color:var(--deep);outline:none}
.gate .err{color:var(--accent);font-weight:700;min-height:1.3em;font-size:16px}
</style>

<div class="gate wrap" id="gate">
  <form class="card" id="gateForm" autocomplete="on">
    <h1>Coquille River Lighthouse Panels</h1>
    <p>Enter the password you received to open the panel review.</p>
    <label for="gatePw">Password</label>
    <input id="gatePw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="gateBtn">Open</button>
    <p class="err" id="gateErr" aria-live="polite"></p>
  </form>
</div>
<div id="app"></div>

  function marks(){
    var has={};
    fields.forEach(function(t){ if(t.value.trim()) has[viewOf(t)]=true; });
    document.querySelectorAll(".strip a[data-nav]").forEach(function(a){ a.classList.toggle("has",!!has[a.getAttribute("data-nav")]); });
    return 0;
  }
  fields.forEach(function(t){ t.addEventListener("input",function(){
    var k=t.getAttribute("data-key"); store[k]=t.value; save();
    fields.forEach(function(o){ if(o!==t && o.getAttribute("data-key")===k) o.value=t.value; });
    marks(); }); });
  marks();

  var views=[].slice.call(document.querySelectorAll("[data-view]"));
  function route(){
    var id=(location.hash||"").replace("#","")||"start";
    if(!document.getElementById(id)||!document.getElementById(id).hasAttribute("data-view")) id="start";
    views.forEach(function(v){ v.hidden = v.id!==id; });
    document.querySelectorAll(".strip a[data-nav]").forEach(function(a){
      if(a.getAttribute("data-nav")===id) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
    });
    window.scrollTo(0,0); setTimeout(function(){window.scrollTo(0,0);},0);
  }
  window.addEventListener("hashchange",route);

  var ENDPOINT = window.CRL_ENDPOINT || "https://script.google.com/macros/s/AKfycbynusB06TPYPhWg_E5gU39pgnhW7uZzN2fJvnlZlAWUXCXipACLi6Ko9_5AACWA5jquyQ/exec";
  var live = /^https:\/\//.test(ENDPOINT);
  var records = {};
  function fmt(d){ try{ return new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }catch(e){ return ""; } }
  function renderRecords(){
    document.querySelectorAll("ul.record").forEach(function(ul){
      var k=ul.getAttribute("data-key"), list=records[k]||[];
      ul.textContent="";
      list.forEach(function(r){
        var li=document.createElement("li");
        var w=document.createElement("span"); w.className="who"; w.textContent=(r.name||"Someone")+(r.time?", "+fmt(r.time):"");
        var x=document.createElement("span"); x.className="txt"; x.textContent=r.text;
        li.appendChild(w); li.appendChild(x); ul.appendChild(li);
      });
      var lab=ul.previousElementSibling;
      if(lab && lab.classList.contains("reclabel")) lab.hidden = !list.length;
    });
  }
  function loadRecords(){
    if(!live) return;
    fetch(ENDPOINT+"?k="+encodeURIComponent(PW),{method:"GET"}).then(function(r){return r.json();}).then(function(rows){
      records={};
      (rows||[]).forEach(function(r){ (records[r.field]=records[r.field]||[]).push(r); });
      renderRecords();
    }).catch(function(){});
  }
  fields.forEach(function(t){
    var k=t.getAttribute("data-key");
    var row=document.createElement("div"); row.className="subrow";
    var btn=document.createElement("button"); btn.type="button"; btn.className="btn submit"; btn.textContent="Submit";
    var msg=document.createElement("span"); msg.className="smsg"; msg.setAttribute("aria-live","polite");
    row.appendChild(btn); row.appendChild(msg);
    var lab=document.createElement("p"); lab.className="reclabel"; lab.textContent="Submitted so far"; lab.hidden=true;
    var ul=document.createElement("ul"); ul.className="record"; ul.setAttribute("data-key",k);
    t.insertAdjacentElement("afterend",ul); t.insertAdjacentElement("afterend",lab); t.insertAdjacentElement("afterend",row);
    btn.addEventListener("click",function(){
      var text=t.value.trim(), who=name.value.trim();
      msg.className="smsg";
      if(!text){ msg.classList.add("err"); msg.textContent="Type something first."; return; }
      if(!who){ msg.classList.add("err"); msg.textContent="Add your name at the top of the page first."; name.focus(); return; }
      if(!live){ msg.classList.add("err"); msg.textContent="Submitting isn't connected yet."; return; }
      btn.disabled=true; msg.textContent="Submitting...";
      var panel=(k.match(/^Panel \d+/)||["All panels"])[0];
      var payload={k:PW, name:who, panel:panel, field:k, question:t.getAttribute("data-q")||"", text:text};
      fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
        .then(function(){
          (records[k]=records[k]||[]).push({name:who,time:new Date().toISOString(),text:text});
          renderRecords();
          fields.forEach(function(o){ if(o.getAttribute("data-key")===k) o.value=""; });
          delete store[k]; save(); marks();
          msg.classList.add("ok"); msg.textContent="Submitted. Thank you.";
          setTimeout(loadRecords,2500);
        })
        .catch(function(){ msg.classList.add("err"); msg.textContent="That didn't go through. Check your internet connection and press Submit again."; })
        .then(function(){ btn.disabled=false; });
    });
  });
  loadRecords();
  route();
};
(function(){
  var form=document.getElementById("gateForm"), inp=document.getElementById("gatePw"), err=document.getElementById("gateErr"), btn=document.getElementById("gateBtn");
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function unlock(pw){
    if(!window.crypto||!crypto.subtle){return Promise.reject(new Error("insecure"));}
    return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"])
      .then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(LOCKED.s),iterations:LOCKED.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);})
      .then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(LOCKED.i)},key,b64(LOCKED.c));})
      .then(function(buf){return new TextDecoder().decode(buf);});
  }
  function open(pw,remember){
    btn.disabled=true; err.textContent="Opening...";
    unlock(pw).then(function(html){
      document.getElementById("app").innerHTML=html;
      document.getElementById("gate").hidden=true;
      if(remember){try{localStorage.setItem("crl-review-pw",pw);}catch(e){}}
      window.__crlApp(pw);
    }).catch(function(e){
      btn.disabled=false;
      err.textContent = (e && e.message==="insecure") ? "This page needs a secure connection. Use the https:// address." : "That password didn't work. Check it and try again.";
      try{localStorage.removeItem("crl-review-pw");}catch(x){}
    });
  }
  form.addEventListener("submit",function(ev){ev.preventDefault(); var pw=inp.value.trim(); if(pw) open(pw,true);});
  var saved=null; try{saved=localStorage.getItem("crl-review-pw");}catch(e){}
  if(saved) open(saved,false); else inp.focus();
})();
</script>
